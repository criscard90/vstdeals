name: Aggiorna Deal VST

on:
  schedule:
    # Esegui ogni 6 ore (alle 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Permette di avviare l'aggiornamento a mano con un click da GitHub

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Esegui scraping e genera deals.json
        run: node scripts/build-deals.mjs

      - name: Esegui test di integrità
        run: npm test

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          if git diff --staged --quiet; then
            echo "Nessun nuovo deal da aggiornare."
          else
            git commit -m "Auto-update deals.json [skip ci]"
            git push
          fi
